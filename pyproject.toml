[project]
name = "amplifier-module-tool-web"
version = "1.0.0"
description = "Reference Web tools (search and fetch) module for Amplifier"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Microsoft MADE:Explorations Team" },
]
dependencies = [
    "aiohttp>=3.14.1",
    "beautifulsoup4>=4.11.0",
    "ddgs>=9.6.0",
    "primp>=0.15.0,<1.0.0",
]

[project.entry-points."amplifier.modules"]
tool-web = "amplifier_module_tool_web:mount"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = [
    "amplifier_module_tool_web",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "strict"

# The test suite has always needed these and never declared them: tests/
# imports amplifier_core.validation.* and relies on amplifier-core's pytest
# plugin for the tool_module fixture, and `asyncio_mode = "strict"` above is
# a pytest-asyncio setting. Before this group existed, a clean checkout of
# this repo could not run its own tests at all -- `uv sync` installed no
# pytest, so `uv run pytest` failed with "Failed to spawn: pytest". Shape and
# contents mirror amplifier-module-provider-openai, the sibling reference
# module. ruff is pinned exactly so a local run matches CI byte for byte.
[dependency-groups]
dev = [
    "amplifier-core>=1.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff==0.16.6",
]

